<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f86ff"/>
      <stop offset="0.55" stop-color="#4554f2"/>
      <stop offset="1" stop-color="#3a2bc4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ff"/>
    </linearGradient>
  </defs>
  <!--bg--><rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g fill="#ffffff">
    <circle cx="190" cy="210" r="9" opacity="0.8"/>
    <circle cx="840" cy="170" r="7" opacity="0.7"/>
    <circle cx="880" cy="430" r="6" opacity="0.55"/>
    <circle cx="140" cy="520" r="6" opacity="0.5"/>
    <circle cx="770" cy="880" r="8" opacity="0.6"/>
    <circle cx="250" cy="860" r="5" opacity="0.5"/>
  </g><!--/bg-->
  <g id="art">
    <!-- orbit, back half -->
    <path d="M 168 742 A 360 92 -12 0 1 856 596" fill="none" stroke="#e8b43a" stroke-width="30" stroke-linecap="round"/>
    <!-- antenna -->
    <line x1="512" y1="300" x2="512" y2="196" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <circle cx="512" cy="172" r="40" fill="#ffd45c"/>
    <circle cx="500" cy="160" r="12" fill="#fff6d6"/>
    <!-- body: a rounded delta -->
    <path d="M 512 300 L 768 740 L 256 740 Z" fill="url(#body)" stroke="url(#body)" stroke-width="120" stroke-linejoin="round"/>
    <!-- visor -->
    <path d="M 396 520 Q 512 470 628 520 Q 660 600 600 640 Q 512 668 424 640 Q 364 600 396 520 Z" fill="#1c2257"/>
    <!-- eyes -->
    <ellipse cx="462" cy="572" rx="30" ry="38" fill="#7fe3ff"/>
    <ellipse cx="562" cy="572" rx="30" ry="38" fill="#7fe3ff"/>
    <circle cx="472" cy="558" r="10" fill="#ffffff"/>
    <circle cx="572" cy="558" r="10" fill="#ffffff"/>
    <!-- smile -->
    <path d="M 478 696 Q 512 722 546 696" fill="none" stroke="#3a43a8" stroke-width="16" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="392" cy="690" rx="26" ry="15" fill="#ff9ab8" opacity="0.75"/>
    <ellipse cx="632" cy="690" rx="26" ry="15" fill="#ff9ab8" opacity="0.75"/>
    <!-- orbit, front half -->
    <path d="M 856 596 A 360 92 -12 0 1 168 742" fill="none" stroke="#ffd45c" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
